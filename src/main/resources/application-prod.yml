# Profil produkcyjny - żadnych sekretów w repo, wszystko z env.
# Aplikacja ma się NIE uruchomić, jeśli którejkolwiek zmiennej brakuje.

spring:
  datasource:
    url: "${DATABASE_URL}"
    username: "${DATABASE_USER}"
    password: "${DATABASE_PASSWORD}"
  jpa:
    show-sql: false
  mail:
    host: "${MAIL_HOST}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME}"
    password: "${MAIL_PASSWORD}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: "${SERVER_PORT:8080}"
  # Aplikacja stoi za reverse proxy (nginx / ALB) - bez tego Spring nie wie,
  # że oryginalny request przyszedł po HTTPS, i generuje złe linki/redirecty.
  forward-headers-strategy: framework

jwt:
  secret: "${JWT_SECRET}"

app:
  frontend:
    url: "${FRONTEND_URL}"
  mail:
    # Bez wartości domyślnej - na produkcji adres nadawcy musi być tym, który
    # dostawca poczty ma zweryfikowany dla naszej domeny. Domyślny adres z profilu
    # bazowego przeszedłby start aplikacji i wywalił się dopiero na pierwszym mailu.
    from: "${MAIL_FROM}"
  cookie:
    secure: true
    # None, żeby ciasteczka docierały do API stojącego pod inną domeną niż SPA.
    # Strict blokowałby je całkowicie w takim wdrożeniu - i to bez żadnego błędu
    # po stronie serwera, więc objawem byłoby po prostu "logowanie nie działa".
    #
    # None WYMAGA secure: true (przeglądarka odrzuca None bez Secure) i wymaga
    # ochrony CSRF, bo SameSite przestaje być jakąkolwiek barierą. Token CSRF jest
    # włączony w SecurityConfig - te dwie rzeczy zmienia się wyłącznie razem.
    same-site: None

management:
  endpoints:
    web:
      exposure:
        # metrics dołożone razem z kontem administratora. Wcześniej wystawione były tylko
        # health, info i prometheus, więc zalogowany administrator dostawał na /actuator/metrics
        # 404 (reguła bezpieczeństwa istnieje, endpointu nie ma) - i wyglądało to jak zepsute
        # konto, a nie jak brak endpointu. Powód ukrywania i tak był pozorny: /actuator/prometheus
        # wystawia nadzbiór tych samych danych i stoi za tą samą regułą hasRole("ADMIN").
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  # Publiczne Swagger UI na produkcji to darmowa mapa API dla atakującego.
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.example.filetranslator: INFO
  file:
    name: logs/app.log
