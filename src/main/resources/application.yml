# Konfiguracja bazowa - wspólna dla wszystkich profili.
# Nadpisania środowiskowe: application-dev.yml / application-prod.yml
# Aktywacja profilu: spring.profiles.active=dev|prod (albo zmienna SPRING_PROFILES_ACTIVE)

spring:
  application:
    name: file-translator
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  task:
    scheduling:
      # Domyślnie harmonogram ma jeden wątek, a zadań jest pięć: trzy nocne sprzątania
      # (tokeny 3:00, skrzynka nadawcza 3:10, zlecenia tłumaczeń 3:20), wysyłkę maili
      # co 10 s i workera tłumaczeń co 2 s. Przy jednym wątku długie sprzątanie
      # wstrzymywałoby wysyłkę, a worker tłumaczeń blokuje swój wątek na czas rozmowy
      # z dostawcą. Rośnie razem z liczbą zadań @Scheduled - dokładając szóste, podnieś i to.
      pool:
        size: 5
  datasource:
    # Domyślnie celuje w bazę z docker-compose (host 5433), a NIE w domyślny port
    # 5432. Na maszynach deweloperskich stoi tam zwykle inny, lokalnie zainstalowany
    # PostgreSQL - celowanie w 5432 oznaczałoby ciche łączenie się z cudzą bazą.
    url: "${DATABASE_URL:jdbc:postgresql://localhost:5433/userapitest}"
    username: "${DATABASE_USER:postgres}"
    password: "${DATABASE_PASSWORD:postgres}"
  jpa:
    hibernate:
      # Schemat tworzą wyłącznie migracje. Warstwa dostępu do danych ma go tylko zweryfikować
      # i wysypać aplikację przy starcie, jeśli encje rozjechały się z bazą.
      ddl-auto: validate
    # Wyłączone celowo: OSIV trzyma sesję Hibernate otwartą przez cały request,
    # co ukrywa błędy lazy-loadingu i blokuje połączenie z puli dłużej niż trzeba.
    open-in-view: false
    show-sql: false
  liquibase:
    # Bez tego Spring Boot szuka domyślnie db/changelog/db.changelog-master.yaml
    # i po cichu nie uruchamia żadnych migracji.
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      # Twardy limit wgrywanego pliku, egzekwowany ZANIM plik wjedzie w całości do pamięci.
      #
      # To jest SUFIT DLA WSZYSTKICH FORMATÓW, więc musi przepuścić największy z nich (PDF
      # i XLSX po 2 MB) - i właśnie dlatego NIE jest jedynym limitem. Właściwy limit jest
      # per format i siedzi w FileType, bo dla tekstu wyprowadza się go z ekonomii dostawcy
      # (bajty to praktycznie znaki, darmowy próg DeepL to 500 tys. znaków miesięcznie na
      # całe konto), a dla binariów z chęci ograniczenia szkody z jednego pliku. Bez tego
      # rozdzielenia plik .txt o rozmiarze dopuszczalnym dla PDF-a przeszedłby tędy
      # i wyjadłby miesięczny budżet konta jednym żądaniem.
      #
      # Tutaj odcinamy tylko to, co nie ma prawa trafić do pamięci procesu; odpowiedzią jest
      # 413 FILE_TOO_LARGE, a limit formatu daje czytelniejsze 400 FILE_TOO_LARGE_FOR_TYPE.
      max-file-size: 2MB
      # Nieco więcej niż plik: w żądaniu multipart jadą jeszcze nagłówki części i pole
      # targetLang. Bez zapasu poprawny plik o maksymalnym rozmiarze byłby odrzucany.
      max-request-size: 3MB

server:
  port: "${SERVER_PORT:2009}"

jwt:
  secret: "${JWT_SECRET}"
  expiration: 900000          # 15 min
  refresh-expiration: 604800000   # 7 dni

app:
  frontend:
    url: "${FRONTEND_URL:http://localhost:5173}"

  # Dokąd na froncie odesłać przeglądarkę po logowaniu przez Google. To są TRASY
  # w routingu SPA, doklejane do app.frontend.url wyżej - osobno od niego, bo tamto jest
  # originem używanym też przez CORS i przy sklejaniu linków w mailach. Sklejenie obu
  # w jedno oznaczałoby, że zmiana trasy logowania na froncie rusza konfigurację CORS.
  oauth2:
    # Dane klienta z Google Cloud Console. Wartości puste oznaczają wyłączone logowanie przez
    # Google, z ostrzeżeniem przy starcie; reszta uwierzytelniania działa bez zmian.
    #
    # Ustawienia leżą pod własnym prefiksem, a nie pod prefiksem klienta OAuth2 Spring
    # Security, i to jest warunek powyższego zachowania. Zadeklarowana tam rejestracja
    # z pustym identyfikatorem jest dla Springa rejestracją błędną, a nie nieobecną, więc
    # walidacja ustawień przerywa start całego kontekstu. Samego yml-a nie da się zapisać
    # warunkowo, dlatego rejestrację buduje osobna konfiguracja, powstająca tylko wtedy, gdy
    # obie wartości są niepuste.
    google:
      client-id: "${GOOGLE_CLIENT_ID:}"
      client-secret: "${GOOGLE_CLIENT_SECRET:}"

    # /dashboard, a nie "/", żeby trafić tam, gdzie ląduje logowanie hasłem
    # (Login.jsx: navigate('/dashboard')). "/" też by zadziałało - RequireAnonymous
    # odesłałoby zalogowanego dalej - ale kosztem dodatkowego przekierowania.
    success-path: /dashboard
    # Do tej trasy doklejany jest parametr error= z kodem odmowy
    # (GOOGLE_EMAIL_NOT_VERIFIED, ACCOUNT_BLOCKED, GOOGLE_AUTH_FAILED).
    #
    # "/", a NIE "/login" - ekran logowania stoi we froncie pod adresem głównym i trasy
    # /login TAM NIE MA. Nieistniejący adres wpada w <Route path="*"> z przekierowaniem
    # na "/", które NIE PRZENOSI query stringa, więc parametr error= przepadłby po drodze:
    # użytkownik zobaczyłby zwykły ekran logowania bez słowa wyjaśnienia, a odmowa
    # (np. konto zablokowane) wyglądałaby na to, że "przycisk nic nie robi".
    failure-path: /

  mail:
    # Adres w nagłówku From i w kopercie SMTP. Osobne ustawienie, bo login do serwera
    # SMTP (spring.mail.username) bardzo często adresem NIE jest - u dostawców typu SES
    # czy SendGrid to klucz API. Serwer odrzuca wtedy całą wysyłkę na MAIL FROM.
    from: "${MAIL_FROM:no-reply@file-translator.local}"
  cookie:
    # secure=true wymaga HTTPS - na localhost po http przeglądarka takie ciasteczko odrzuci
    secure: "${COOKIE_SECURE:true}"
    same-site: "${COOKIE_SAME_SITE:Strict}"
    # Ścieżka /auth, a nie /auth/refresh: przy węższej ścieżce przeglądarka nie wysyłała
    # ciasteczka do /auth/logout, więc serwer nie wiedział, którą sesję unieważnić.
    # Nadal znacznie węziej niż "/" - token odświeżający nie krąży przy każdym żądaniu do API.
    refresh-token-path: /auth
    # Czas życia ciasteczek wyprowadzony z konfiguracji JWT - jedno źródło prawdy,
    # ciasteczko nie może przeżyć tokenu, który zawiera.
    access-token-max-age: "${jwt.expiration}ms"
    refresh-token-max-age: "${jwt.refresh-expiration}ms"

  # Skrzynka nadawcza maili. Uzasadnienie wzorca: changelog 0005-mail-outbox.xml.
  outbox:
    enabled: true
    # Opóźnienie wysyłki do tej wartości jest akceptowalne przy mailach transakcyjnych.
    # Gdyby przestało być, zamiast skracania interwału właściwym krokiem jest CDC.
    poll-interval: 10s
    batch-size: 50
    # Maile z paczki lecą równolegle, ale nie wszystkie naraz: serwery SMTP limitują
    # liczbę jednoczesnych połączeń z jednego nadawcy i przekroczenie limitu kończy się
    # odrzuceniem. Podnosić dopiero po sprawdzeniu, ile pozwala konkretny dostawca.
    concurrency: 4
    max-attempts: 5
    # Rośnie wykładniczo: 30s, 1m, 2m, 4m - chwilowa awaria SMTP nie zamienia się
    # w dobijanie serwera co sekundę.
    retry-backoff: 30s
    # Musi być wyraźnie dłuższe niż realny czas wysyłki, inaczej druga instancja
    # zabierze wiersz, gdy pierwsza jeszcze czeka na odpowiedź SMTP.
    claim-timeout: 2m
    # Po tym czasie od wysłania wiersz jest usuwany (OutboxCleanupJob, co noc o 3:10).
    # Doba, bo tyle wynosi ważność tokenu rejestracji - najdłuższego z tych, które lądują
    # w payloadzie. Później payload nie niesie już użytecznego sekretu, a trzymany dłużej
    # jest tylko plaintextowym tokenem i adresem email bez terminu ważności.
    # Kasowane są wyłącznie wiadomości wysłane; nieudane zostają, bo na nich opiera się sygnał
    # mówiący, czy poczta w ogóle wychodzi.
    retention: 1d

  # Tłumaczenie plików. Uzasadnienie kolejki i modelu: changelog 0007-translation-jobs.xml.
  translation:
    enabled: true
    # echo  - atrapa oznaczająca tekst; nic nie wychodzi na zewnątrz, żaden klucz niepotrzebny
    # deepl - prawdziwe tłumaczenie; wymaga DEEPL_API_KEY
    # Domyślnie echo, bo brak klucza ma dawać działającą aplikację, a nie taką, która
    # przyjmuje zlecenia i po cichu je porzuca.
    provider: "${TRANSLATION_PROVIDER:echo}"
    # Krócej niż w skrzynce nadawczej (10 s): tu po drugiej stronie czeka człowiek
    # patrzący na ekran, a nie skrzynka pocztowa.
    poll-interval: 2s
    # Ile znaków jeden użytkownik może zlecić w ciągu doby. Chroni konto u dostawcy,
    # nie serwer - od serwera jest limiter żądań niżej.
    daily-char-limit: 50000
    batch-size: 5
    # Dostawcy limitują liczbę równoczesnych żądań; nieograniczona pula zamienia szczyt
    # ruchu w serię odpowiedzi 429 dla całej paczki.
    concurrency: 2
    max-attempts: 3
    # Rośnie wykładniczo: 10s, 20s, 40s.
    retry-backoff: 10s
    # Musi być wyraźnie dłuższe niż realny czas odpowiedzi dostawcy, inaczej druga instancja
    # zabierze zlecenie, gdy pierwsza jeszcze czeka.
    claim-timeout: 2m
    # Co ile pytać dostawcę o gotowość DOKUMENTU (PDF/XLSX). Osobno od poll-interval wyżej:
    # tamto jest zaglądaniem do własnej bazy, to jest żądaniem do cudzego API.
    document-poll-interval: 5s
    # W magazynie obiektowym leżą pliki użytkowników - to jest powód retencji, a nie rozmiar
    # tabeli. Użytkownik może skasować zlecenie sam; to jest to, co dzieje się, gdy tego
    # nie zrobi. Druga połowa retencji to reguła wygasania na kubełku, która nie może być krótsza
    # niż ta wartość - inaczej pliki znikają spod żywych zleceń.
    retention: 30d
    deepl:
      # Konta darmowe mają inny host niż płatne - pomyłka kończy się odmową uwierzytelnienia,
      # która wygląda jak zły klucz.
      api-url: "${DEEPL_API_URL:https://api-free.deepl.com/v2}"
      api-key: "${DEEPL_API_KEY:}"
      connect-timeout: 5s
      # BEZ tego zawieszony dostawca trzyma wątek z puli tłumaczeń w nieskończoność -
      # przy concurrency: 2 wystarczą dwa takie żądania, żeby kolejka stanęła i nie
      # pojawił się przy tym ani jeden wpis w logu.
      read-timeout: 30s

  # Magazyn plików użytkowników. Treść zleceń NIE leży już w bazie - w kolumnach
  # translation_jobs zostały same klucze obiektów.
  storage:
    # memory - mapa w pamięci procesu; pliki giną przy restarcie i nie są współdzielone
    #          między instancjami. Poprawne wyłącznie w testach.
    # s3     - MinIO z docker compose albo prawdziwe AWS S3.
    #
    # Domyślnie memory, tą samą zasadą co provider: echo. Brak skonfigurowanego magazynu
    # ma dawać działającą aplikację, a nie taką, która nie wstaje. InMemoryObjectStore
    # ostrzega przy starcie, więc pomyłka jest widoczna w logu, a nie dopiero po restarcie.
    type: "${STORAGE_TYPE:memory}"
    # Pusty endpoint = prawdziwe AWS (adres wylicza SDK z regionu i nazwy kubełka).
    # Dla MinIO trzeba go podać - patrz docker-compose.yml.
    endpoint: "${STORAGE_ENDPOINT:}"
    bucket: "${STORAGE_BUCKET:file-translator}"
    # Wymagany przez SDK do podpisania żądania także wtedy, gdy po drugiej stronie
    # stoi MinIO, któremu region jest obojętny.
    region: "${STORAGE_REGION:eu-central-1}"
    # Poświadczenia podawane WPROST, nie domyślnym łańcuchem dostawców AWS: ten podłapałby
    # ~/.aws/credentials z maszyny deweloperskiej i aplikacja pisałaby do cudzego kubełka,
    # wyglądając przy tym na poprawnie działającą. Uzasadnienie: S3ClientConfig.
    access-key: "${STORAGE_ACCESS_KEY:}"
    secret-key: "${STORAGE_SECRET_KEY:}"

  # Konto administratora zakładane przy starcie. Bez niego rola ADMIN jest nieosiągalna,
  # a więc /actuator/metrics i /actuator/prometheus są martwe. Szczegóły: AdminBootstrap.
  admin:
    # Puste wartości domyślne są CELOWE i nie wolno ich zamienić na "${ADMIN_PASSWORD}"
    # bez wartości domyślnej w nadziei na szybkie padnięcie startu. Ten idiom (patrz
    # app.mail.from i jwt.secret) działa tylko dla wartości czytanych przez @Value.
    # Binding @ConfigurationProperties idzie przez PropertySourcesPlaceholdersResolver,
    # który tworzy helper z ignoreUnresolvablePlaceholders = true - nieustawiona zmienna
    # NIE wywala startu, tylko wpisuje do pola literał "${ADMIN_PASSWORD}", bez żadnego
    # ostrzeżenia. Brakujące dane wyłapuje AdminBootstrap i tylko wtedy, gdy enabled=true.
    enabled: "${ADMIN_ENABLED:false}"
    email: "${ADMIN_EMAIL:}"
    password: "${ADMIN_PASSWORD:}"

  # Blokada konta po serii nieudanych logowań - chroni konkretne konto przed
  # zgadywaniem hasła, także gdy próby idą z wielu adresów IP.
  account-lock:
    enabled: true
    max-attempts: 5
    lock-duration: 15m

  # Limity liczby żądań - chronią serwer i pozostałych użytkowników.
  # Próg logowania jest wyższy niż max-attempts blokady konta, żeby limit per IP
  # nie odcinał żądań, zanim w ogóle zadziała blokada konkretnego konta
  # (i żeby kilka osób za jednym NAT-em mogło się normalnie logować).
  rate-limit:
    enabled: true
    # memory - kubełki w pamięci procesu; poprawne tylko przy JEDNEJ instancji aplikacji
    # redis  - wspólny magazyn dla wszystkich instancji; wymagane przy skalowaniu poziomym,
    #          bo inaczej każda instancja liczy limit osobno i realny próg jest N razy wyższy
    store: "${RATE_LIMIT_STORE:memory}"
    redis-url: "${RATE_LIMIT_REDIS_URL:}"
    policies:
      - path: /auth/login
        capacity: 10
        period: 1m
      - path: /auth/register
        capacity: 5
        period: 1h
      - path: /auth/confirm
        capacity: 20
        period: 1h
      # Ostro, bo każde żądanie to mail wysłany na cudzy adres - bez limitu endpoint
      # nadaje się do zasypania czyjejś skrzynki wiadomościami z tej aplikacji.
      - path: /auth/forgot-password
        capacity: 3
        period: 1h
      # Luźniej niż forgot-password: tu żądanie nie generuje maila, a użytkownik może
      # kilka razy nie trafić w politykę hasła. Token i tak jest jednorazowy.
      - path: /auth/reset-password
        capacity: 10
        period: 1h
      - path: /auth/refresh
        capacity: 30
        period: 1m
      # Wyłącznie POST: zlecenie tłumaczenia kosztuje znaki u zewnętrznego dostawcy,
      # a odczyt listy i odpytywanie o status są darmowe. Bez rozróżnienia metody
      # frontend odpytujący co 2 s o status wyczerpywałby próg przeznaczony na zlecenia.
      - path: /translations
        method: POST
        capacity: 30
        period: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Osobne endpointy /health/liveness i /health/readiness dla orkiestratora (k8s, ECS)
      probes:
        enabled: true
      show-details: when-authorized
  health:
    mail:
      # Wyłączone celowo. Health check to odpowiedź na pytanie "czy ta instancja może
      # obsługiwać ruch", a nie "czy wszystkie usługi zewnętrzne żyją". Wysyłka maili
      # jest asynchroniczna i nie blokuje żadnego endpointu, więc niedostępny SMTP
      # nie może przestawiać całej aplikacji na DOWN - w Kubernetesie oznaczałoby to
      # restartowanie w pełni sprawnych podów przez awarię dostawcy poczty.
      # Baza danych zostaje w health checku, bo bez niej API faktycznie nie działa.
      enabled: false
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.example.filetranslator: DEBUG
