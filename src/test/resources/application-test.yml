# Profil testowy - H2 w pamięci, bez potrzeby stawiania PostgreSQL-a.
#
# Świadomie NIE używamy tu ddl-auto: create-drop. Schemat budują te same migracje
# Liquibase co na produkcji, a Hibernate je potem weryfikuje (ddl-auto: validate).
# Dzięki temu zwykłe `mvn test` wykrywa rozjazd encji z migracjami oraz błędy
# w samych changelogach - zamiast maskować je autogeneracją schematu.

spring:
  datasource:
    # MODE=PostgreSQL, bo produkcja i dev chodzą na PostgreSQL - tryb zgodności ma
    # naśladować silnik docelowy, inaczej testy sprawdzają zachowanie, którego nigdzie
    # nie ma. Zysk konkretny: w MODE=MySQL H2 porównywał teksty bez rozróżniania
    # wielkości liter, więc testy nie odwzorowywały wyszukiwania po adresie email
    # (patrz EmailNormalizer). Tu już rozróżnia, tak jak PostgreSQL.
    #
    # Bez DATABASE_TO_LOWER, mimo że PostgreSQL składa niecytowane identyfikatory do
    # MAŁYCH liter: H2 składa je do wielkich i dokładnie tego oczekuje Liquibase dla
    # swojej tabeli DATABASECHANGELOG. Wymuszenie małych liter kończy się błędem
    # "unable to create the database changelog table" przy DRUGIM kontekście Springa
    # (baza żyje dłużej niż kontekst przez DB_CLOSE_DELAY=-1) - sprawdzone przy tej
    # migracji, padał CsrfLifecycleTest.
    #
    # To nadal jest H2 udające PostgreSQL, więc job "integration" w CI zostaje jedynym
    # miejscem, gdzie migracje i SKIP LOCKED są sprawdzane na prawdziwym silniku.
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # Pula połączeń przycięta DLA TESTÓW - na H2 bez znaczenia, na PostgreSQL-u warunek
    # tego, żeby suite w ogóle wstała.
    #
    # Spring CACHE'UJE konteksty testowe i nie zamyka ich do końca JVM-a, a każdy kontekst
    # trzyma własną pulę Hikari. Domyślnie to 10 połączeń, otwieranych OD RAZU i trzymanych
    # bezczynnie, bo minimum-idle domyślnie równa się maximum-pool-size. Kontekstów jest
    # kilkanaście - różnicuje je nie tylko @TestPropertySource, ale też każdy inny zestaw
    # @MockitoBean - więc przy max_connections = 100 (domyślne w postgres:17-alpine, czyli
    # i w jobie "integration") budżet kończy się przy jedenastym kontekście.
    #
    # Objaw jest mylący i dlatego ten komentarz jest tak długi: pada "Failed to load
    # ApplicationContext" w KLASIE, która akurat wstawała jako pierwsza po wyczerpaniu
    # budżetu, więc log wskazuje przypadkowy test. Trafione 2026-08-13 - na CI padł
    # CsrfLifecycleTest, przy odtworzeniu lokalnie TranslationQuotaTest i
    # TranslationWorkerTest, przy identycznym kodzie. NAZWA TESTU WSKAZUJE MOMENT, NIE
    # PRZYCZYNĘ. Prawdziwy komunikat siedzi dopiero w ostatnim "Caused by":
    # org.postgresql.util.PSQLException: FATAL: sorry, too many clients already.
    #
    # minimum-idle: 0 jest tu ważniejsze niż sam rozmiar puli - bez tego każdy kontekst
    # zajmuje komplet połączeń, nawet jeśli jego testy dawno się skończyły. idle-timeout
    # oddaje je z powrotem (10 s to minimum, jakie Hikari przyjmuje).
    #
    # Piątka, a nie mniej: OutboxTest.publish_shouldSendBatchInParallel trzyma na barierze
    # wszystkie wątki paczki naraz (app.outbox.concurrency, domyślnie 4), a każdy ma własną
    # transakcję REQUIRES_NEW. Pula mniejsza niż równoległość zamieniłaby ten test w zakleszczenie
    # czekające na connection-timeout.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  h2:
    console:
      enabled: false
  mail:
    host: localhost
    port: 25
    username: test@localhost
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: "/26qw1Fh9D6pEAcJpLvCfVDQl0tqYmylZ+EsvPGW4QY="
  expiration: 900000
  refresh-expiration: 604800000

app:
  frontend:
    url: "http://localhost:5173"
  cookie:
    secure: false
    same-site: Lax
  # Domyślnie wyłączone: limit jest stanowy i przechodziłby między testami w tej samej
  # instancji JVM, przez co wynik zależałby od kolejności wykonania. Testy, które
  # sprawdzają sam limiter, włączają go u siebie przez @TestPropertySource.
  rate-limit:
    enabled: false
    store: memory
    policies: []
  outbox:
    # Wyłączone, bo publisher odpalający się w tle zabierałby wiersze, które testy chcą
    # sprawdzić - wynik zależałby od tego, co zdąży się wykonać. Testy wołają
    # OutboxPublisher.publishBatch() wprost.
    enabled: false
    poll-interval: 1h
    batch-size: 50
    # Powyżej 1, żeby testy przechodziły przez ścieżkę równoległą, a nie obok niej
    concurrency: 4
    # Niżej niż na produkcji, żeby test wyczerpania prób nie potrzebował pięciu iteracji
    max-attempts: 3
    retry-backoff: 1s
    claim-timeout: 2m
  translation:
    # Wyłączone z tego samego powodu co outbox: worker odpalający się w tle zabierałby
    # zlecenia, które testy chcą sprawdzić. Testy wołają processBatch() wprost.
    enabled: false
    provider: echo
    poll-interval: 1h
    # Wysoko, żeby zwykłe testy nie odbijały się od limitu. Test limitu ustawia swój
    # własny przez @TestPropertySource.
    daily-char-limit: 1000000
    batch-size: 5
    # Powyżej 1, żeby testy przechodziły przez ścieżkę równoległą, a nie obok niej
    concurrency: 2
    # Niżej niż na produkcji, żeby test wyczerpania prób nie potrzebował trzech iteracji
    max-attempts: 2
    retry-backoff: 1s
    claim-timeout: 2m
    # Krótko, żeby test wznawiania odpytywania nie czekał realnych sekund
    document-poll-interval: 1s
    retention: 30d
    deepl:
      api-url: http://localhost/deepl-nieuzywany
      api-key: ""
      connect-timeout: 1s
      read-timeout: 2s
  # Magazyn w pamięci procesu - z tego samego powodu, dla którego testy chodzą na H2
  # i na atrapie tłumacza: suite ma nie wymagać stojącej infrastruktury. Prawdziwy
  # S3ObjectStore jest wykonywany wyłącznie w jobie "integration" (MinIO w kontenerze),
  # tak samo jak RedisBucketProvider.
  storage:
    type: memory
  account-lock:
    enabled: true
    max-attempts: 3
    lock-duration: 15m

logging:
  level:
    liquibase: WARN
