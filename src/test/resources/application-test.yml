# Profil testowy.
#
# UWAGA NA KOLEJNOŚĆ CZYTANIA TEGO PLIKU: domyślny przebieg testów NIE chodzi na H2.
# TestInfrastructure podnosi PostgreSQL-a, Redisa i MinIO w kontenerach (Testcontainers)
# i nadpisuje stąd datasource, magazyn limitów i magazyn plików WŁAŚCIWOŚCIAMI SYSTEMOWYMI,
# które stoją w kolejności pierwszeństwa Springa wyżej niż ten plik. Wartości poniżej są
# więc dwiema rzeczami naraz: konfiguracją wspólną dla obu wariantów (wszystko poza tymi
# trzema) oraz konfiguracją wariantu H2, który włącza się profilem `./mvnw test -Ph2`.
#
# Schemat budują świadomie te same migracje co na produkcji, a nie automatyczne tworzenie
# tabel z encji; warstwa dostępu do danych jedynie weryfikuje zgodność.
# Dzięki temu zwykły przebieg testów wykrywa rozjazd encji z migracjami oraz błędy
# w samych changelogach - zamiast maskować je autogeneracją schematu.

spring:
  datasource:
    # MODE=PostgreSQL, bo produkcja i dev chodzą na PostgreSQL - tryb zgodności ma
    # naśladować silnik docelowy, inaczej testy sprawdzają zachowanie, którego nigdzie
    # nie ma. Zysk konkretny: w MODE=MySQL H2 porównywał teksty bez rozróżniania
    # wielkości liter, więc testy nie odwzorowywały wyszukiwania po adresie email
    # (patrz EmailNormalizer). Tu już rozróżnia, tak jak PostgreSQL.
    #
    # Bez DATABASE_TO_LOWER, mimo że PostgreSQL składa niecytowane identyfikatory do
    # MAŁYCH liter: H2 składa je do wielkich i dokładnie tego oczekuje Liquibase dla
    # swojej tabeli DATABASECHANGELOG. Wymuszenie małych liter kończy się błędem
    # "unable to create the database changelog table" przy DRUGIM kontekście Springa
    # (baza żyje dłużej niż kontekst przez DB_CLOSE_DELAY=-1) - sprawdzone przy tej
    # migracji, padał CsrfLifecycleTest.
    #
    # To nadal jest H2 UDAJĄCE PostgreSQL, więc migracje, SKIP LOCKED i porównania tekstu
    # są sprawdzane naprawdę dopiero na kontenerze - czyli w domyślnym przebiegu i w CI.
    # Zielone `-Ph2` nie jest obietnicą zielonego CI i nie ma nią być.
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # Pula połączeń przycięta DLA TESTÓW - na H2 bez znaczenia, na PostgreSQL-u (czyli
    # w domyślnym przebiegu, na kontenerze) warunek tego, żeby suite w ogóle wstała.
    #
    # Spring CACHE'UJE konteksty testowe i nie zamyka ich do końca JVM-a, a każdy kontekst
    # trzyma własną pulę Hikari. Domyślnie to 10 połączeń, otwieranych OD RAZU i trzymanych
    # bezczynnie, bo minimum-idle domyślnie równa się maximum-pool-size. Kontekstów jest
    # kilkanaście - różnicuje je nie tylko @TestPropertySource, ale też każdy inny zestaw
    # @MockitoBean - więc przy max_connections = 100 (domyślne w postgres:17-alpine, czyli
    # i w kontenerze podnoszonym przez TestInfrastructure) budżet kończy się przy
    # jedenastym kontekście. Po scaleniu jobów CI dotyczy to KAŻDEGO przebiegu poza -Ph2,
    # a nie tylko jednego zadania CI, więc objaw jest widoczny od razu, także lokalnie.
    #
    # Objaw jest mylący: błąd ładowania kontekstu zgłasza klasa, która akurat wstawała jako
    # pierwsza po wyczerpaniu budżetu połączeń, więc log wskazuje przypadkowy test. Nazwa
    # testu wskazuje moment, a nie przyczynę - prawdziwy komunikat znajduje się dopiero
    # w ostatniej przyczynie łańcucha wyjątków i mówi o wyczerpaniu limitu połączeń bazy.



    #
    # minimum-idle: 0 jest tu ważniejsze niż sam rozmiar puli - bez tego każdy kontekst
    # zajmuje komplet połączeń, nawet jeśli jego testy dawno się skończyły. idle-timeout
    # oddaje je z powrotem (10 s to minimum, jakie Hikari przyjmuje).
    #
    # Piątka, a nie mniej: OutboxTest.publish_shouldSendBatchInParallel trzyma na barierze
    # wszystkie wątki paczki naraz (app.outbox.concurrency, domyślnie 4), a każdy ma własną
    # transakcję REQUIRES_NEW. Pula mniejsza niż równoległość zamieniłaby ten test w zakleszczenie
    # czekające na connection-timeout.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  h2:
    console:
      enabled: false
  mail:
    host: localhost
    port: 25
    username: test@localhost
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: "/26qw1Fh9D6pEAcJpLvCfVDQl0tqYmylZ+EsvPGW4QY="
  expiration: 900000
  refresh-expiration: 604800000

app:
  frontend:
    url: "http://localhost:5173"
  cookie:
    secure: false
    same-site: Lax
  # ATRAPOWY klient OAuth2 - żeby logowanie przez Google BYŁO WPIĘTE w łańcuch w każdym
  # kontekście testowym. Bez tego rejestracja nie powstaje, SecurityConfig pomija
  # oauth2Login i cała ta gałąź konfiguracji nie wykonuje się ani razu.
  #
  # W application-test.yml, a NIE w @TestPropertySource pojedynczej klasy: @TestPropertySource
  # rozbija klucz cache'a kontekstów, czyli dokłada JEDEN kontekst z własną pulą połączeń
  # (próg max_connections został tu już raz przekroczony - patrz komentarz przy puli wyżej).
  # Skoro klient jest wpięty we WSZYSTKICH kontekstach, cała reszta suite pilnuje przy
  # okazji, że oauth2Login nie podmienił punktu wejścia uwierzytelnienia na przekierowanie
  # do dostawcy - inaczej chronione ścieżki oddawałyby 302 zamiast 401 ProblemDetail.
  #
  # UWAGA, TO JEST DOKŁADNIE TA ŚLEPOTA, KTÓRA PRZEPUŚCIŁA AWARIĘ 2026-08-20: skoro tutaj
  # zawsze stoją poprawne wartości, ścieżka "bez skonfigurowanego klienta" nie wykonywała
  # się w testach ANI RAZU, a to właśnie ona kładła kontener. Pilnuje jej teraz
  # GoogleLoginDisabledTest, który zeruje te wartości u siebie - i tylko dlatego coś sprawdza.
  #
  # Wartości są jawnie fałszywe i nic nimi nie wychodzi na zewnątrz: adresy końcówek Google
  # są zaszyte w CommonOAuth2Provider, więc start NIE wykonuje żadnego zapytania do sieci.
  oauth2:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
  # Domyślnie wyłączone: limit jest stanowy i przechodziłby między testami w tej samej
  # instancji JVM, przez co wynik zależałby od kolejności wykonania. Testy, które
  # sprawdzają sam limiter, włączają go u siebie przez @TestPropertySource.
  rate-limit:
    enabled: false
    # W domyślnym przebiegu podmieniane na "redis" przez TestInfrastructure - kubełki lądują
    # wtedy w kontenerze i RedisBucketProvider jest w ogóle wykonywany. Kontener jest świeży
    # przy każdym przebiegu, więc kubełki z poprzedniego nie mają jak przejść; dlatego
    # TestInfrastructure celowo nie włącza testcontainers.reuse.enable.
    store: memory
    policies: []
  outbox:
    # Wyłączone, bo publisher odpalający się w tle zabierałby wiersze, które testy chcą
    # sprawdzić - wynik zależałby od tego, co zdąży się wykonać. Testy wołają
    # OutboxPublisher.publishBatch() wprost.
    enabled: false
    poll-interval: 1h
    batch-size: 50
    # Powyżej 1, żeby testy przechodziły przez ścieżkę równoległą, a nie obok niej
    concurrency: 4
    # Niżej niż na produkcji, żeby test wyczerpania prób nie potrzebował pięciu iteracji
    max-attempts: 3
    retry-backoff: 1s
    claim-timeout: 2m
  translation:
    # Wyłączone z tego samego powodu co outbox: worker odpalający się w tle zabierałby
    # zlecenia, które testy chcą sprawdzić. Testy wołają processBatch() wprost.
    enabled: false
    provider: echo
    poll-interval: 1h
    # Wysoko, żeby zwykłe testy nie odbijały się od limitu. Test limitu ustawia swój
    # własny przez @TestPropertySource.
    daily-char-limit: 1000000
    batch-size: 5
    # Powyżej 1, żeby testy przechodziły przez ścieżkę równoległą, a nie obok niej
    concurrency: 2
    # Niżej niż na produkcji, żeby test wyczerpania prób nie potrzebował trzech iteracji
    max-attempts: 2
    retry-backoff: 1s
    claim-timeout: 2m
    # Krótko, żeby test wznawiania odpytywania nie czekał realnych sekund
    document-poll-interval: 1s
    retention: 30d
    deepl:
      api-url: http://localhost/deepl-nieuzywany
      api-key: ""
      connect-timeout: 1s
      read-timeout: 2s
  # Magazyn w pamięci procesu - wariant profilu -Ph2, tam gdzie nie ma Dockera.
  # W domyślnym przebiegu TestInfrastructure podmienia to na "s3" wskazujące MinIO
  # w kontenerze, i to jest jedyne miejsce, gdzie S3ObjectStore się wykonuje.
  # Atrapa tłumacza (provider: echo) zostaje w OBU wariantach: dostawcy nie stawia się
  # w kontenerze, bo DeepL jest usługą zewnętrzną i kosztuje znaki.
  storage:
    type: memory
  account-lock:
    enabled: true
    max-attempts: 3
    lock-duration: 15m

logging:
  level:
    liquibase: WARN
