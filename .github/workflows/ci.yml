name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Nowy push na tę samą gałąź anuluje poprzedni, jeszcze trwający build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cache zależności Mavena - bez tego każdy build pobiera je od nowa
          cache: maven

      - name: Build, test and generate coverage report
        # verify (a nie test) uruchamia też fazę, w której JaCoCo składa raport pokrycia
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        # Uruchamiane także po nieudanym buildzie - raport z testów jest najbardziej
        # potrzebny właśnie wtedy, kiedy coś się wywaliło.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Sam build, bez publikowania - pilnuje, żeby Dockerfile nie zepsuł się
        # niezauważenie między wdrożeniami.
        run: docker build -t file-translator:${{ github.sha }} .
