name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Nowy push na tę samą gałąź anuluje poprzedni, jeszcze trwający build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jeden przebieg testów, na silnikach używanych na produkcji. Kontenery usług podnosi sam
  # przebieg testów, więc konfiguracja nie jest powielana w tym pliku jako lista zmiennych
  # środowiskowych, czyli drugie miejsce, w którym trzeba by pamiętać o każdym nowym ustawieniu.
  #
  # Co ten job faktycznie wykonuje, a czego przebieg na H2 wykonać nie może:
  #   - migracje Liquibase na PostgreSQL-u (dropIndex, dropTable, addNotNullConstraint
  #     zachowują się różnie w różnych silnikach, a ddl-auto: validate wykryje
  #     rozjazd encji ze schematem dopiero przy starcie aplikacji);
  #   - FOR UPDATE SKIP LOCKED w skrzynce nadawczej na prawdziwym PostgreSQL-u;
  #   - porównania tekstu Z ROZRÓŻNIANIEM wielkości liter, czego H2 w trybie zgodności nie
  #     odwzorowuje wiernie - a od tego zależy wyszukiwanie po adresie email (EmailNormalizer);
  #   - RedisBucketProvider, czyli gałąź limitera, która na H2 nigdy się nie wykonywała;
  #   - S3ObjectStore, czyli jedyną gałąź magazynu plików rozmawiającą z S3 - podpisywanie
  #     żądań, kasowanie po prefiksie, mapowanie braku obiektu na ObjectMissingException.
  #
  # Runnery GitHuba mają Dockera, więc Testcontainers nie wymaga tu żadnej konfiguracji.
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cache zależności Mavena - bez tego każdy build pobiera je od nowa
          cache: maven

      - name: Build, test and generate coverage report
        # verify (a nie test) uruchamia też fazę, w której JaCoCo składa raport pokrycia
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        # Uruchamiane także po nieudanym buildzie - raport z testów jest najbardziej
        # potrzebny właśnie wtedy, kiedy coś się wywaliło.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    # Zależność wymaga powodzenia poprzedniego zadania - porażka albo anulowanie pomija to
    # zadanie. Dzięki temu obraz nie powstaje z kodu, którego testy nie przeszły na silnikach
    # używanych na produkcji.
    needs: [ build ]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Sam build, bez publikowania - pilnuje, żeby Dockerfile nie zepsuł się
        # niezauważenie między wdrożeniami.
        run: docker build -t file-translator:${{ github.sha }} .
