name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Nowy push na tę samą gałąź anuluje poprzedni, jeszcze trwający build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cache zależności Mavena - bez tego każdy build pobiera je od nowa
          cache: maven

      - name: Build, test and generate coverage report
        # verify (a nie test) uruchamia też fazę, w której JaCoCo składa raport pokrycia
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        # Uruchamiane także po nieudanym buildzie - raport z testów jest najbardziej
        # potrzebny właśnie wtedy, kiedy coś się wywaliło.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  # Ten sam zestaw testów, ale na silnikach używanych na produkcji zamiast na H2
  # i na kubełkach w pamięci. Osobny job, a nie zamiast poprzedniego: szybki build
  # na H2 ma dalej dawać wynik w kilkadziesiąt sekund, bez czekania na kontenery.
  #
  # Co to faktycznie sprawdza, a czego build na H2 sprawdzić nie może:
  #   - migracje Liquibase na PostgreSQL-u (dropIndex, dropTable, addNotNullConstraint
  #     zachowują się różnie w różnych silnikach, a ddl-auto: validate wykryje
  #     rozjazd encji ze schematem dopiero przy starcie aplikacji);
  #   - FOR UPDATE SKIP LOCKED w skrzynce nadawczej na prawdziwym PostgreSQL-u;
  #   - porównania tekstu Z ROZRÓŻNIANIEM wielkości liter, czego H2 w trybie
  #     zgodności nie odwzorowuje wiernie - a od tego zależy wyszukiwanie po adresie
  #     email (patrz EmailNormalizer);
  #   - RedisBucketProvider, czyli jedyną gałąź limitera, która na profilu testowym
  #     nigdy się nie wykonywała.
  integration:
    name: Testy na PostgreSQL i Redisie
    runs-on: ubuntu-latest

    services:
      # Wersje takie same jak w docker-compose.yml - CI ma sprawdzać to, co lokalnie.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: userapitest
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Bez health checka job ruszyłby, zanim baza przyjmuje połączenia - kontener
        # wstaje w sekundę, ale inicjacja katalogu danych trwa dłużej.
        options: >-
          --health-cmd="pg_isready -U postgres -d userapitest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Test against PostgreSQL and Redis
        # Przez zmienne środowiskowe, a NIE przez osobny profil testowy: profil trzeba by
        # aktywować w każdej klasie testowej (@ActiveProfiles("test") jest wpisane na sztywno),
        # a drugi plik z konfiguracją rozjeżdżałby się z pierwszym przy każdej zmianie.
        # Zmienne środowiskowe stoją w kolejności pierwszeństwa Springa WYŻEJ niż
        # application-test.yml, więc podmieniają tylko to, co ma być inne, i dziedziczą resztę.
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/userapitest
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          # Jawnie, bo application-test.yml wskazuje sterownik H2 - sama zmiana URL-a
          # zostawiłaby ustawiony org.h2.Driver.
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          # RedisBucketProvider łączy się w konstruktorze, więc samo podniesienie kontekstu
          # sprawdza konfigurację połączenia; RateLimitTest sprawdza potem liczenie kubełków.
          APP_RATE_LIMIT_STORE: redis
          APP_RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379
        run: ./mvnw -B -ntp test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-postgres
          path: target/surefire-reports/
          if-no-files-found: warn

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    # OBA joby testowe, nie sam "build". Wcześniej stało tu "needs: build", więc obraz
    # powstawał także wtedy, gdy "integration" był czerwony - a to jedyny job sprawdzający
    # migracje i zapytania na silniku, którego używa produkcja. Trafione 2026-08-09:
    # 7 błędów na PostgreSQL-u przy zielonym H2 i mimo to zbudowany obraz.
    # needs wymaga POWODZENIA wszystkich wymienionych jobów - porażka albo anulowanie
    # któregokolwiek pomija ten job.
    needs: [ build, integration ]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Sam build, bez publikowania - pilnuje, żeby Dockerfile nie zepsuł się
        # niezauważenie między wdrożeniami.
        run: docker build -t file-translator:${{ github.sha }} .
