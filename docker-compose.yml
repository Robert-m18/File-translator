# Kompletne środowisko deweloperskie: `docker compose up -d`
#
# Sens tego pliku: nowa osoba (albo ja na innym komputerze) uruchamia projekt
# jedną komendą, bez ręcznego instalowania PostgreSQL-a i konfigurowania konta SMTP.

services:

  postgres:
    image: postgres:17-alpine
    container_name: ft-postgres
    environment:
      POSTGRES_DB: userapitest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Na hoście 5433, w kontenerze 5432. Aplikacja łączy się siecią Compose'a
      # (host "postgres", port 5432), więc mapowanie jest wyłącznie dla narzędzi
      # uruchamianych na hoście - DBeaver, psql, HeidiSQL.
      #
      # 5432 zostawiamy wolne CELOWO i to nie jest ostrożność na wyrost: na tej
      # maszynie stoi tam już inny PostgreSQL. Zajęcie domyślnego portu albo
      # wywaliłoby `docker compose up`, albo - gorzej - narzędzie na hoście
      # połączyłoby się z cudzym serwerem, myśląc że ogląda bazę projektu.
      # Dokładnie tak wyglądała wcześniejsza pułapka z MariaDB na 3306.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Aplikacja musi poczekać, aż baza faktycznie przyjmuje połączenia.
      # Sam fakt, że kontener wystartował, tego nie oznacza - stąd healthcheck
      # i depends_on: condition: service_healthy poniżej.
      # -U i -d muszą się zgadzać z POSTGRES_USER/DB: pg_isready bez nich pyta
      # o bazę o nazwie użytkownika systemowego i zwraca "no response".
      test: [ "CMD-SHELL", "pg_isready -U postgres -d userapitest" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Lokalny serwer SMTP z interfejsem webowym - maile weryfikacyjne zostają
  # na maszynie i widać je pod http://localhost:8025. Żadnych zewnętrznych kont.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ft-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Wspólny magazyn limitów żądań. Potrzebny dopiero przy skalowaniu poziomym -
  # przy jednej instancji aplikacja domyślnie liczy limity w pamięci i Redis stoi bezczynnie.
  # Żeby go faktycznie użyć, ustaw RATE_LIMIT_STORE=redis w sekcji app poniżej.
  redis:
    image: redis:7-alpine
    container_name: ft-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    container_name: ft-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "2009:2009"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 2009
      # Host "postgres" to nazwa usługi w sieci Compose'a, nie localhost -
      # z wnętrza kontenera localhost oznacza sam kontener aplikacji. Port 5432,
      # czyli wewnętrzny port kontenera bazy, a nie 5433 z mapowania na hoście.
      DATABASE_URL: jdbc:postgresql://postgres:5432/userapitest
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      FRONTEND_URL: http://localhost:5173
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: Lax
      # Zmień na "redis", żeby limity były wspólne dla wszystkich instancji aplikacji
      RATE_LIMIT_STORE: memory
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      # Konto administratora zakładane przy starcie - bez niego /actuator/metrics
      # i /actuator/prometheus są nieosiągalne dla nikogo. Hasło jest tu jawne świadomie:
      # ten plik jest lokalnym środowiskiem deweloperskim i niesie już postgres/postgres do bazy.
      # Do application-dev.yml to NIE trafia, bo "dev" jest profilem domyślnym - znane hasło
      # do konta z dostępem do aktuatora dostawałby wtedy każdy ./mvnw spring-boot:run.
      ADMIN_ENABLED: "true"
      ADMIN_EMAIL: admin@file-translator.local
      ADMIN_PASSWORD: LokalnyAdmin1
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:2009/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres-data:
