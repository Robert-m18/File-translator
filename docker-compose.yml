# Kompletne środowisko deweloperskie: `docker compose up -d`
#
# Sens tego pliku: nowa osoba (albo ja na innym komputerze) uruchamia projekt
# jedną komendą, bez ręcznego instalowania PostgreSQL-a i konfigurowania konta SMTP.

services:

  postgres:
    image: postgres:17-alpine
    container_name: ft-postgres
    environment:
      POSTGRES_DB: userapitest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Na hoście 5433, w kontenerze 5432. Aplikacja łączy się siecią Compose'a
      # (host "postgres", port 5432), więc mapowanie jest wyłącznie dla narzędzi
      # uruchamianych na hoście - DBeaver, psql, HeidiSQL.
      #
      # Domyślny port zostaje wolny celowo i nie jest to ostrożność na wyrost: na tej
      # maszynie stoi tam już inny PostgreSQL. Zajęcie domyślnego portu albo
      # wywaliłoby `docker compose up`, albo - gorzej - narzędzie na hoście
      # połączyłoby się z cudzym serwerem, myśląc że ogląda bazę projektu.
      # Serwer odpowiadający na domyślnym porcie nie jest dowodem na to, który to serwer.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Aplikacja musi poczekać, aż baza faktycznie przyjmuje połączenia.
      # Sam fakt, że kontener wystartował, tego nie oznacza - stąd healthcheck
      # i depends_on: condition: service_healthy poniżej.
      # -U i -d muszą się zgadzać z POSTGRES_USER/DB: pg_isready bez nich pyta
      # o bazę o nazwie użytkownika systemowego i zwraca "no response".
      test: [ "CMD-SHELL", "pg_isready -U postgres -d userapitest" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Lokalny serwer SMTP z interfejsem webowym - maile weryfikacyjne zostają
  # na maszynie i widać je pod http://localhost:8025. Żadnych zewnętrznych kont.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ft-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Wspólny magazyn limitów żądań. Potrzebny dopiero przy skalowaniu poziomym -
  # przy jednej instancji aplikacja domyślnie liczy limity w pamięci i Redis stoi bezczynnie.
  # Żeby go faktycznie użyć, ustaw RATE_LIMIT_STORE=redis w sekcji app poniżej.
  redis:
    image: redis:7-alpine
    container_name: ft-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Magazyn obiektowy na pliki użytkowników - lokalne zastępstwo S3, tą samą zasadą
  # co Mailpit dla poczty: `docker compose up` ma być działającym systemem bez konta
  # u zewnętrznego dostawcy. Aplikacja rozmawia z nim TYM SAMYM kodem co z AWS
  # (S3ObjectStore), różnicę robi wyłącznie endpoint i styl adresowania kubełka.
  #
  # 9000 to API, 9001 to konsola webowa (http://localhost:9001, minioadmin/minioadmin) -
  # tam widać, czy pliki faktycznie lądują pod users/{id}/jobs/{uuid}/.
  minio:
    image: minio/minio:latest
    container_name: ft-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Jawne poświadczenia deweloperskie, tak samo jak postgres/postgres wyżej.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Zakłada kubełek i regułę wygasania, po czym kończy pracę. Osobna usługa, a nie
  # polecenie w aplikacji: tworzenie kubełka to czynność administracyjna, a aplikacja
  # z prawem do zakładania kubełków ma na produkcji za szerokie uprawnienia.
  minio-init:
    image: minio/mc:latest
    container_name: ft-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # REGUŁA WYGASANIA JEST DRUGĄ POŁOWĄ RETENCJI i to jest tu najważniejsza linia.
    # Wiersze zleceń kasuje TranslationCleanupJob według app.translation.retention (30 dni),
    # a pliki - ta reguła. Nic tych dwóch wartości nie wiąże poza uważnością.
    #
    # 31 dni, czyli WIĘCEJ niż retencja aplikacji, i kierunek nie jest dowolny: aplikacja
    # ma kasować pierwsza, a reguła być siatką bezpieczeństwa (łapie pliki osierocone przy
    # przyjmowaniu zleceń, gdy wiersz nigdy nie powstał). Reguła KRÓTSZA niż retencja
    # oznaczałaby pliki znikające spod żywych zleceń - użytkownik dostaje wtedy
    # 410 CONTENT_EXPIRED przy pobieraniu czegoś, co widzi na liście jako gotowe.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/file-translator &&
      (mc ilm rule add --expire-days 31 local/file-translator ||
       mc ilm add --expiry-days 31 local/file-translator || true) &&
      echo 'MinIO gotowe: kubelek file-translator, wygasanie po 31 dniach'
      "

  app:
    build:
      context: .
    container_name: ft-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "2009:2009"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 2009
      # Host "postgres" to nazwa usługi w sieci Compose'a, nie localhost -
      # z wnętrza kontenera localhost oznacza sam kontener aplikacji. Port 5432,
      # czyli wewnętrzny port kontenera bazy, a nie 5433 z mapowania na hoście.
      DATABASE_URL: jdbc:postgresql://postgres:5432/userapitest
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      FRONTEND_URL: http://localhost:5173
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: Lax
      # Zmień na "redis", żeby limity były wspólne dla wszystkich instancji aplikacji
      RATE_LIMIT_STORE: memory
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      # Magazyn plików. Host "minio" to nazwa usługi w sieci Compose'a, port 9000 to
      # wewnętrzny port kontenera - nie mapowanie na hoście, tak samo jak przy bazie.
      # Bez STORAGE_TYPE=s3 aplikacja wstałaby na magazynie w PAMIĘCI i gubiła pliki
      # przy każdym restarcie kontenera, działając przy tym pozornie poprawnie.
      STORAGE_TYPE: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: file-translator
      STORAGE_REGION: eu-central-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      # Konto administratora zakładane przy starcie - bez niego /actuator/metrics
      # i pozostałe endpointy operacyjne są nieosiągalne dla nikogo. Hasło jest tu jawne
      # świadomie: plik opisuje lokalne środowisko deweloperskie i niesie już jawne poświadczenia
      # do bazy. Do konfiguracji profilu domyślnego takie hasło nie trafia, bo wtedy konto
      # z dostępem do danych operacyjnych powstawałoby przy każdym lokalnym uruchomieniu.
      # echo = atrapa oznaczająca tekst; nic nie wychodzi na zewnątrz i nie trzeba konta
      # u dostawcy. Żeby tłumaczyć naprawdę: TRANSLATION_PROVIDER=deepl i DEEPL_API_KEY
      # z konta DeepL API Free (uwaga: konta darmowe używają hosta api-free.deepl.com,
      # płatne api.deepl.com - pomyłka daje 403 wyglądające jak zły klucz).
      TRANSLATION_PROVIDER: "${TRANSLATION_PROVIDER:-echo}"
      DEEPL_API_KEY: "${DEEPL_API_KEY:-}"
      # Logowanie przez Google. Puste = wyłączone, z ostrzeżeniem WARN przy starcie
      # (rejestracja i logowanie hasłem działają bez tego). Adres powrotny do wpisania
      # w Google Cloud Console to http://localhost:2009/login/oauth2/code/google.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      ADMIN_ENABLED: "true"
      ADMIN_EMAIL: admin@file-translator.local
      ADMIN_PASSWORD: LokalnyAdmin1
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:2009/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres-data:
  minio-data:
