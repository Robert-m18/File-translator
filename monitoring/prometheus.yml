global:
  scrape_interval: 30s

scrape_configs:
  - job_name: file-translator-render
    scheme: https
    metrics_path: /actuator/prometheus
    scrape_timeout: 15s
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/render-password
    static_configs:
      - targets: ["file-translator-xp7n.onrender.com"]